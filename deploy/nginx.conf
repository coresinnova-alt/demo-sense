# Rendered by the nginx image entrypoint (envsubst) so ${PORT} comes from
# Cloud Run's injected environment.

server {
    listen       ${PORT};
    listen       [::]:${PORT};
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Cloud Run terminates TLS upstream, so never emit an absolute redirect
    # with the container's own scheme and port.
    absolute_redirect off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml application/manifest+json;

    # Content-hashed assets are immutable, so they cache forever. `expires` is
    # deliberately not used here — it emits a second Cache-Control header.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include    /etc/nginx/conf.d/security-headers.conf;
        try_files  $uri =404;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=604800" always;
        include    /etc/nginx/conf.d/security-headers.conf;
    }

    # The shell must never be cached, or a deploy leaves clients on stale JS.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include    /etc/nginx/conf.d/security-headers.conf;
    }

    # Container/uptime probe.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Client-side routing: unknown paths render the SPA shell, not a 404.
    location / {
        add_header Cache-Control "no-cache" always;
        include    /etc/nginx/conf.d/security-headers.conf;
        try_files  $uri $uri/ /index.html;
    }
}
